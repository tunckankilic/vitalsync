workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      cancel_previous_builds: true
      branch_patterns:
        - pattern: 'main'
          include: true
    environment:
      groups:
        - app_store_credentials
        # Sentry symbol upload. Define these as SECRET vars in this Codemagic
        # group — never inline them here:
        #   SENTRY_DSN, SENTRY_ORG, SENTRY_PROJECT, SENTRY_AUTH_TOKEN
        - sentry_credentials
      vars:
        BUNDLE_ID: "site.tunckankilic.vitalsync"
      # Pin the toolchain for reproducible release builds. Bump deliberately
      # after validating locally — never use 'stable'/'latest' for store builds,
      # an upstream bump can break a release without a code change.
      flutter: 3.44.0
      xcode: 26.5
      cocoapods: default
    integrations:
      app_store_connect: Code Magic CI/CD
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Run analyze
        script: |
          flutter analyze --no-fatal-infos
      - name: Run tests
        script: |
          flutter test
      - name: Increment build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || true)
          if [ -z "$LATEST_BUILD" ] || [ "$LATEST_BUILD" = "0" ]; then
            LATEST_BUILD=1
          fi
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "BUILD_NUMBER=$NEW_BUILD" >> $CM_ENV
          echo "Latest build: $LATEST_BUILD -> New build: $NEW_BUILD"
      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=ENV=prod \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload symbols to Sentry
        script: |
          # Uploads Dart obfuscation symbols (build/symbols) + iOS dSYMs so
          # release crash stacks deobfuscate. Secrets come from the
          # sentry_credentials env group; skip cleanly if not configured.
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping symbol upload"
          else
            dart run sentry_dart_plugin
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/symbols/**
    publishing:
      app_store_connect:
        auth: integration
        # main push -> TestFlight only. App Store submission is intentionally
        # manual: promote the build from App Store Connect when ready, so a
        # routine push can never trigger an App Store review by accident.
        submit_to_testflight: true
        # When you want CI to push straight to App Store review, uncomment the
        # block below. release_type MANUAL keeps the final go-live in your hands
        # (Apple approves, you press "Release"). Switch to AFTER_APPROVAL only
        # once your release process is disciplined enough for auto go-live.
        # submit_to_app_store: true
        # release_type: MANUAL
      email:
        recipients:
          - tuncsoftwarehere@gmail.com
        notify:
          success: true
          failure: true

  ios-debug:
    name: iOS Debug Build (PR Check)
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
        - pattern: 'Day-*'
          include: true
    environment:
      # Match the release workflow so PR checks catch the same toolchain issues.
      flutter: 3.44.0
      xcode: 26.5
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Run analyze
        script: |
          flutter analyze --no-fatal-infos
      - name: Run tests
        script: |
          flutter test
