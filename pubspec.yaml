name: vitalsync
description: "VitalSync — Health & Fitness Companion. Medication reminders,
  symptom tracking, workout logging, progress analysis, and cross-module
  insights."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.10.7

dependencies:
  amplify_api: ^2.0.0
  amplify_auth_cognito: ^2.0.0
  amplify_flutter: ^2.0.0
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  drift: ^2.23.1
  dynamic_color: ^1.7.0
  equatable: ^2.0.7
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.17
  get_it: ^9.2.0
  go_router: ^17.1.0
  http: ^1.2.0
  injectable: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.2
  rxdart: ^0.28.0
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlcipher_flutter_libs: ^0.7.0+eol
  table_calendar: ^3.1.3
  timezone: ^0.11.0
  uuid: ^4.5.1
  workmanager: ^0.9.0+3
  share_plus: ^12.0.1
  vibration: ^3.1.6
  confetti: ^0.8.0
  flutter_animate: ^4.5.0
  flutter_secure_storage: ^10.3.1
  sign_in_with_apple: ^8.1.0
  sentry_flutter: ^9.21.0
  url_launcher: ^6.3.2
  flutter_timezone: ^5.1.0
  health: ^13.3.1

dev_dependencies:
  bloc_test: ^10.0.0

  # --- Code Generation ---
  build_runner: ^2.4.14
  drift_dev: ^2.23.1

  # --- Linting ---
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.4

  # --- Testing ---
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.3

  # --- Crash reporting (release symbol upload) ---
  # Uploads the Dart obfuscation symbols (--split-debug-info) and the iOS
  # dSYMs to Sentry so release crash stacks deobfuscate. Configured by the
  # `sentry:` block below. Run with `dart run sentry_dart_plugin` after a build.
  sentry_dart_plugin: ^3.4.0

  # --- App icon generation ---
  # Generates the iOS app icon set from a single opaque 1024x1024 master PNG.
  # Settings live in the top-level `flutter_launcher_icons:` block below.
  # Run with `dart run flutter_launcher_icons` after placing the master PNG.
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true

# Sentry symbol-upload configuration (sentry_dart_plugin).
#
# Secrets are NEVER stored here. The plugin reads them from the environment:
#   SENTRY_AUTH_TOKEN  — auth token (required; from env/CI secret)
#   SENTRY_ORG         — Sentry organization slug
#   SENTRY_PROJECT     — Sentry project slug
# release/dist are auto-detected by sentry_flutter from the native build
# (CFBundleShortVersionString + CFBundleVersion), so they match what runs on
# device — nothing to set here.
sentry:
  upload_debug_symbols: true   # Dart obfuscation symbols + native dSYMs
  upload_sources: false        # health app: never ship source context
  upload_source_maps: false    # native iOS/Android build, no web maps
  symbols_path: build/symbols  # must match --split-debug-info=build/symbols
  # org/project/auth_token intentionally omitted — supplied via env vars above.

# App icon configuration (flutter_launcher_icons).
# Generates the iOS icon set from one opaque 1024x1024 master PNG.
# iOS rejects alpha channels; remove_alpha_ios flattens any transparency.
flutter_launcher_icons:
  image_path: "assets/icon/vitalsynch_1024.png"
  ios: true
  remove_alpha_ios: true
